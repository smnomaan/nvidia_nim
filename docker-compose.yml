services:
  nim:
    image: ${NIM_IMAGE:-nvcr.io/nim/meta/llama-3.1-8b-instruct@sha256:4c912ccaf0d9ddf84a230df2dc196b4e68be882a29974429dbec58808374cfc0}
    ports:
      - "8000:8000"
    volumes:
      - nim_cache:/opt/nim/.cache
    environment:
      NGC_API_KEY: ${NGC_API_KEY:-${NVIDIA_API_KEY:-}}
    command:
      - --max-model-len
      - "32768"
      - --enable-auto-tool-choice
      - --tool-call-parser
      - llama3_json
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://localhost:8000/v1/health/ready', timeout=5)"
      interval: 15s
      timeout: 10s
      retries: 40
      # A cold cache can take more than 15 minutes to download and initialize.
      start_period: 20m
    restart: unless-stopped

  ingest:
    build: .
    profiles: ["ingest"]
    environment: &app-environment
      NIM_BASE_URL: http://nim:8000/v1
      NIM_MODEL: ${NIM_MODEL:-meta/llama-3.1-8b-instruct}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-local-nim}
      EMBEDDING_DEVICE: cpu
      DATA_DIR: /app/data
      CHROMA_DB_DIR: /app/chroma_db
      STATE_DIR: /app/state
      LANGCHAIN_TRACING_V2: "false"
      HF_HOME: /home/appuser/.cache/huggingface
    volumes: &app-volumes
      - paper_data:/app/data
      - chroma_data:/app/chroma_db
      - app_state:/app/state
      - huggingface_cache:/home/appuser/.cache/huggingface
    command: ["python", "-m", "src.ingest"]

  app:
    build: .
    ports:
      - "8501:8501"
    depends_on:
      nim:
        condition: service_healthy
    environment: *app-environment
    volumes: *app-volumes
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5)
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  nim_cache:
  paper_data:
  chroma_data:
  app_state:
  huggingface_cache:
